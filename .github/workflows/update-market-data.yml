name: Update Taiwan market data

on:
  schedule:
    - cron: "20,40 14-16 * * 1-5"
      timezone: "Asia/Taipei"
    - cron: "20 20 * * 1-5"
      timezone: "Asia/Taipei"
  workflow_dispatch:
    inputs:
      date:
        description: "Closed trading date to recover (YYYY-MM-DD); blank uses the latest closed weekday"
        required: false
        type: string
  push:
    branches:
      - main
    paths:
      - scripts/update_market_data.py
      - .github/workflows/update-market-data.yml

permissions:
  contents: write

concurrency:
  group: taiwan-market-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out updater
        uses: actions/checkout@v4

      - name: Check updater regression tests
        run: python3 -m unittest discover -s tests -v

      - name: Check whether the target snapshot is already published
        id: freshness
        shell: bash
        env:
          REQUESTED_DATE: ${{ inputs.date || '' }}
        run: |
          target_date="$(python3 - <<'PY'
          import os
          from datetime import date
          from scripts.update_market_data import default_target_date
          latest = default_target_date()
          raw = os.environ.get("REQUESTED_DATE", "").strip()
          target = date.fromisoformat(raw) if raw else latest
          if target > latest:
              raise SystemExit("Requested date is later than the latest closed weekday")
          print(target.isoformat())
          PY
          )"
          echo "target_date=${target_date}" >> "$GITHUB_OUTPUT"
          current_date=""

          if git ls-remote --exit-code --heads origin refs/heads/data >/dev/null 2>&1; then
            git fetch origin data
            if git show origin/data:generated-data/market_manifest.json >/tmp/current_market_manifest.json 2>/dev/null; then
              current_date="$(python3 -c 'import json; print(json.load(open("/tmp/current_market_manifest.json", encoding="utf-8")).get("endDate", ""))')"
            fi
          fi

          echo "Target closed date: ${target_date}; published endDate: ${current_date:-none}"
          if [[ "$current_date" == "$target_date" || "$current_date" > "$target_date" ]]; then
            echo "needed=false" >> "$GITHUB_OUTPUT"
            echo "The target date or a newer validated snapshot is already published; skipping."
          else
            echo "needed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and validate Yahoo snapshot
        if: steps.freshness.outputs.needed == 'true'
        id: build
        shell: bash
        env:
          TARGET_DATE: ${{ steps.freshness.outputs.target_date }}
        run: |
          for attempt in 1 2 3; do
            rm -rf /tmp/taiwan-stock-data
            if python3 scripts/update_market_data.py --output /tmp/taiwan-stock-data --workers 16 --date "$TARGET_DATE"; then
              break
            fi
            if [[ "$attempt" == "3" ]]; then
              echo "Snapshot build failed after three attempts; the published data is unchanged."
              exit 1
            fi
            echo "Retrying the full validated build after a transient source failure (attempt ${attempt}/3)."
            sleep 20
          done
          if [[ -f /tmp/taiwan-stock-data/market_manifest.json ]]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "No trading-day snapshot was produced; the existing data branch is unchanged."
          fi

      - name: Publish validated snapshot
        if: steps.build.outputs.ready == 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git ls-remote --exit-code --heads origin refs/heads/data >/dev/null 2>&1; then
            git fetch origin data
            git switch -C data origin/data
          else
            git switch --orphan data
            git rm -rf --cached . >/dev/null 2>&1 || true
          fi

          rm -rf generated-data
          cp -R /tmp/taiwan-stock-data generated-data
          git add -A generated-data

          if git diff --cached --quiet; then
            echo "Validated snapshot is unchanged."
            exit 0
          fi

          end_date="$(python3 -c 'import json; print(json.load(open("generated-data/market_manifest.json", encoding="utf-8"))["endDate"])')"
          if git rev-parse --verify HEAD >/dev/null 2>&1; then
            git commit --amend -m "Update market data ${end_date}"
          else
            git commit -m "Update market data ${end_date}"
          fi
          git push --force-with-lease origin HEAD:data
